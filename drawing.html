    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 3rem 1.25rem 4rem;
      background: #f6f5f2;
      color: #272727;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      text-align: center;
    }

    .site-title {
      margin: 0 0 3rem;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .ampersand {
      color: #a20f2d;
      letter-spacing: 0;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .divider {
      width: 80px;
      height: 1px;
      margin: 0 auto 3rem;
      background: #a20f2d;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem 1.5rem;
      align-items: start;
    }

    .gallery-item {
      margin: 0;
    }

    .gallery-item a {
      display: block;
      overflow: hidden;
      background: #e9e7e2;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 360px;
      object-fit: contain;
      background: #e9e7e2;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .gallery-item a:hover img,
    .gallery-item a:focus-visible img {
      transform: scale(1.015);
      opacity: 0.94;
    }

    figcaption {
      margin-top: 0.8rem;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem 2rem;
      margin-top: 3.5rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(39, 39, 39, 0.2);
    }

    .links a {
      color: #272727;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: 1rem;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid transparent;
      transition: color 150ms ease, border-color 150ms ease;
    }

    .links a:hover,
    .links a:focus-visible {
      color: #a20f2d;
      border-bottom-color: #a20f2d;
    }

    @media (max-width: 600px) {
      body {
        padding-top: 2rem;
      }

      .site-title {
        margin-bottom: 2.25rem;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 2.25rem;
      }

      .gallery-item img {
        height: auto;
        max-height: 75vh;
      }
    }
  </style>
</head>
