<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | Graphite &amp; Grief</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 3rem 2rem;
      background: #f6f5f2;
      color: #272727;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .site-title {
      margin: 0 0 3rem;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .ampersand {
      color: #a20f2d;
      letter-spacing: 0;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .divider {
      width: 80px;
      height: 1px;
      margin: 0 auto 2rem;
      background: #a20f2d;
    }

    .events-image {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      margin: 0 auto 2rem;
    }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem 2rem;
      margin-top: 2rem;
    }

    .links a {
      color: #272727;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: 1rem;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid transparent;
      transition: color 150ms ease, border-color 150ms ease;
    }

    .links a:hover,
    .links a:focus-visible {
      color: #a20f2d;
      border-bottom-color: #a20f2d;
    }
  </style>
</head>

<body>
  <main>
    <div class="site-title">
      Graphite <span class="ampersand">&amp;</span> Grief
    </div>

    <h1>Events</h1>
    <div class="divider"></div>

    <img
      class="events-image"
      src="Promo_Square.jpg"
      alt="Graphite and Grief event promotion"
    >

    <nav class="links" aria-label="Page navigation">
      <a href="index.html">Return home</a>
      <a
        href="https://www.instagram.com/graphiteandgrief"
        target="_blank"
        rel="noopener noreferrer"
      >Instagram</a>
    </nav>
  </main>
</body>
</html>
