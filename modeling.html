<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Modeling | Graphite &amp; Grief</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 3rem 2rem;
      background: #f6f5f2;
      color: #272727;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    .site-title {
      margin: 0 0 4rem;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .ampersand {
      color: #a20f2d;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 1rem;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .coming-soon {
      margin: 0 0 3rem;
      color: #777;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .divider {
      width: 80px;
      height: 1px;
      margin: 0 auto 2rem;
      background: #a20f2d;
    }

    a {
      color: #272727;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, serif;
      font-size: 1rem;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid transparent;
      transition:
        color 150ms ease,
        border-color 150ms ease;
    }

    a:hover,
    a:focus-visible {
      color: #a20f2d;
      border-bottom-color: #a20f2d;
    }
  </style>
</head>

<body>
  <main>
    <div class="site-title">
      Graphite <span class="ampersand">&amp;</span> Grief
    </div>

    <h2>Modeling</h2>

    <div class="divider"></div>

    <p class="coming-soon">Coming soon</p>

    <a href="index.html">Return home</a>
  </main>
</body>
</html>
